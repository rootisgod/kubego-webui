---
# Refresh the apt cache and upgrade every installed package. Reboots
# only if the kernel (or another reboot-required package) says so.
- name: apt update and upgrade
  hosts: all
  become: true
  tasks:
    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      ansible.builtin.reboot:
        msg: "Reboot triggered by KubeGo update-upgrade playbook"
      when: reboot_required.stat.exists
