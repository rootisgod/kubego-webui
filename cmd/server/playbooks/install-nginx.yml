---
# Install Nginx and drop a minimal landing page, so hitting the VM's IP
# on :80 returns a visible success response.
- name: Install Nginx
  hosts: all
  become: true
  tasks:
    - name: apt install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Landing page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html>
            <head><title>{{ inventory_hostname }}</title></head>
            <body>
              <h1>{{ inventory_hostname }} is running</h1>
              <p>Provisioned by KubeGo via Ansible.</p>
            </body>
          </html>

    - name: Ensure nginx is enabled and running
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
