#cloud-config

# Prepare this VM for Ansible management.
# Python 3 is Ansible's only remote-side requirement.

# Default login: ubuntu / ubuntu (dev convenience only — throwaway VMs).
chpasswd:
  expire: false
  users:
    - name: ubuntu
      password: ubuntu
      type: text
ssh_pwauth: true

package_update: true

packages:
  - python3

runcmd:
  - systemctl enable ssh
