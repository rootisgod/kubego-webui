#cloud-config

# Common development tools: git, curl, build tools, vim, htop, jq, and tree.

# Default login: ubuntu / ubuntu (dev convenience only — throwaway VMs).
chpasswd:
  expire: false
  users:
    - name: ubuntu
      password: ubuntu
      type: text
ssh_pwauth: true

package_update: true

packages:
  - git
  - curl
  - wget
  - build-essential
  - vim
  - htop
  - jq
  - tree
  - unzip
  - net-tools
