version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "none"
  LDFLAGS: '-s -w -X main.Version={{.VERSION}} -X main.BuildTime={{.DATE}} -X main.GitCommit={{.COMMIT}}'

tasks:
  default:
    desc: Build the project (frontend + backend with embedded assets)
    deps: [build]

  # --- Frontend ---

  frontend-install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm install
    sources:
      - package.json
    generates:
      - node_modules/.package-lock.json

  frontend-build:
    desc: Build frontend (produces frontend/dist/).
    dir: frontend
    deps: [frontend-install]
    cmds:
      - npm run build
    sources:
      - src/**/*
      - index.html
      - vite.config.js
      - tailwind.config.js
      - postcss.config.js
      - package.json
    generates:
      - dist/index.html

  embed-frontend:
    desc: Copy built frontend into cmd/server for go:embed
    deps: [frontend-build]
    cmds:
      - rm -rf cmd/server/frontend/dist
      - mkdir -p cmd/server/frontend
      - cp -r frontend/dist cmd/server/frontend/dist

  # --- Build ---

  build-backend:
    desc: Build the Go binary without re-building the frontend (fast)
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -o kubego ./cmd/server

  build:
    desc: Build the Go binary with the embedded frontend
    deps: [embed-frontend]
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -o kubego ./cmd/server

  build-all:
    desc: Cross-compile for all platforms
    deps: [embed-frontend]
    cmds:
      - mkdir -p dist
      - GOOS=darwin  GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -o dist/kubego-darwin-arm64  ./cmd/server
      - GOOS=darwin  GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -o dist/kubego-darwin-amd64  ./cmd/server
      - GOOS=linux   GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -o dist/kubego-linux-arm64   ./cmd/server
      - GOOS=linux   GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -o dist/kubego-linux-amd64   ./cmd/server
      - GOOS=windows GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -o dist/kubego-windows-amd64.exe ./cmd/server

  # --- Run ---

  run:
    desc: Build (frontend + backend) and run against ~/.kube/config on :8081
    deps: [build]
    cmds:
      - ./kubego --kubeconfig "$HOME/.kube/config" --port 8081

  dev-backend:
    desc: Run the Go backend with `go run` against ~/.kube/config on :8081
    cmds:
      - go run ./cmd/server --kubeconfig "$HOME/.kube/config" --port 8081

  dev-frontend:
    desc: Run the Vite dev server with API proxy (hot-reload, paired with `task dev-backend`).
    dir: frontend
    deps: [frontend-install]
    cmds:
      - npm run dev

  # --- KinD dev cluster ---

  kind:install:
    desc: Install the kind CLI (override with KIND_VERSION, KIND_INSTALL_DIR)
    cmds:
      - ./scripts/kind-install.sh

  kind:up:
    desc: Create a kubego-dev KinD cluster and install KubeVirt + CDI
    cmds:
      - ./scripts/kind-up.sh

  kind:down:
    desc: Delete the kubego-dev KinD cluster
    cmds:
      - ./scripts/kind-down.sh

  kind:reset:
    desc: Delete and recreate the kubego-dev KinD cluster
    cmds:
      - ./scripts/kind-down.sh
      - ./scripts/kind-up.sh

  # --- CLI tooling ---

  install-kubectl:
    desc: Install the kubectl CLI (override with KUBECTL_VERSION, KUBECTL_INSTALL_DIR)
    cmds:
      - ./scripts/kubectl-install.sh

  install-k9s:
    desc: Install the k9s CLI (override with K9S_VERSION, K9S_INSTALL_DIR)
    cmds:
      - ./scripts/k9s-install.sh

  # --- Tests ---

  test:
    desc: Run all Go tests
    cmds:
      - go test ./... -v -count=1

  test-race:
    desc: Run Go tests with race detector
    cmds:
      - go test ./... -v -race -count=1

  test-frontend:
    desc: Run frontend tests (may fail until the frontend is re-wired)
    dir: frontend
    deps: [frontend-install]
    cmds:
      - npx vitest run

  smoke:
    desc: |
      End-to-end smoke test — builds the binary, starts it, hits /version,
      logs in, and confirms a VM call returns the stub error. Safe to run
      against any kubeconfig (real cluster, fake, or an unreachable one).
    cmds:
      - ./scripts/smoke-test.sh

  # --- Systemd service (Linux) ---

  install-binary:
    desc: Copy the built kubego binary to /usr/local/bin/kubego (run with sudo)
    cmds:
      - |
        if [ -n "{{default "" .KUBEGO_INSTALL_SRC}}" ]; then
          SRC="{{default "" .KUBEGO_INSTALL_SRC}}"
        elif [ -f kubego ]; then
          SRC=kubego
        elif [ -f dist/kubego-linux-amd64 ]; then
          SRC=dist/kubego-linux-amd64
        else
          echo "Error: no kubego binary found."
          echo "Build one first with 'task build' (native) or 'task build-all' (cross-compile)."
          exit 1
        fi
        if [ ! -f "$SRC" ]; then
          echo "Error: install source not found: $SRC"
          exit 1
        fi
        echo "Installing $SRC -> /usr/local/bin/kubego"
        install -m 0755 "$SRC" /usr/local/bin/kubego

  service-install:
    desc: Install kubego as a systemd service — copies the binary, writes the unit, starts it (run with sudo)
    deps: [install-binary]
    cmds:
      - |
        if [ ! -f /root/.kube/config ]; then
          echo "Warning: /root/.kube/config not found."
          echo "The service runs as root and resolves its cluster from in-cluster"
          echo "config, then \$KUBECONFIG, then /root/.kube/config. Make sure one is"
          echo "available, or edit /etc/systemd/system/kubego.service to add"
          echo "  ExecStart=/usr/local/bin/kubego --kubeconfig /path/to/config"
        fi
      - |
        printf '%s\n' \
          '[Unit]' \
          'Description=KubeGo Web - Kubernetes / KubeVirt Management UI' \
          'After=network-online.target' \
          'Wants=network-online.target' \
          '' \
          '[Service]' \
          'Type=simple' \
          'Environment=HOME=/root' \
          'ExecStart=/usr/local/bin/kubego' \
          'Restart=on-failure' \
          'RestartSec=5' \
          '' \
          '[Install]' \
          'WantedBy=multi-user.target' \
          > /etc/systemd/system/kubego.service
      - systemctl daemon-reload
      - systemctl enable kubego
      - systemctl start kubego
      - echo "kubego service installed and started (listening on :8081 by default)"

  service-start:
    desc: Start the kubego service (run with sudo)
    cmds:
      - systemctl start kubego
      - echo "kubego service started"

  service-stop:
    desc: Stop the kubego service (run with sudo)
    cmds:
      - systemctl stop kubego
      - echo "kubego service stopped"

  service-restart:
    desc: Restart the kubego service (run with sudo)
    cmds:
      - systemctl restart kubego
      - echo "kubego service restarted"

  service-deploy:
    desc: Build kubego, install the binary, and restart the systemd service (run with sudo)
    cmds:
      - task: build
      - task: install-binary
        vars:
          KUBEGO_INSTALL_SRC: kubego
      - systemctl restart kubego
      - echo "kubego built, installed, and restarted"

  service-status:
    desc: Show kubego service status
    cmds:
      - systemctl status kubego

  service-logs:
    desc: Follow kubego service logs
    cmds:
      - journalctl -u kubego -f

  service-remove:
    desc: Remove the kubego systemd service (run with sudo)
    cmds:
      - systemctl stop kubego || true
      - systemctl disable kubego || true
      - rm -f /etc/systemd/system/kubego.service
      - rm -f /usr/local/bin/kubego
      - systemctl daemon-reload
      - echo "kubego service removed"

  update-binary-linux:
    desc: Download latest release from GitHub, stop service, replace binary, start service (run with sudo)
    cmds:
      - echo "Downloading latest release..."
      - curl -sL "https://github.com/rootisgod/kubego-webui/releases/latest/download/kubego-linux-amd64" -o /tmp/kubego-linux-amd64
      - chmod +x /tmp/kubego-linux-amd64
      - echo "Stopping service..."
      - systemctl stop kubego
      - cp /tmp/kubego-linux-amd64 /usr/local/bin/kubego
      - rm /tmp/kubego-linux-amd64
      - echo "Starting service..."
      - systemctl start kubego
      - echo "Update complete. New version:"
      - /usr/local/bin/kubego --version || true

  # --- Clean ---

  clean:
    desc: Remove all build artifacts
    cmds:
      - rm -f kubego kubego-smoke
      - rm -rf dist/
      - rm -rf cmd/server/frontend/dist
      - rm -rf frontend/dist
      - rm -rf frontend/node_modules
      - rm -f .smoke-config.json
